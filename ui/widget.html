<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Narra Widget</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div class="widget" data-tauri-drag-region>
    <header data-tauri-drag-region>
      <button class="brand" id="openMain" title="Open Narra">
        <img src="narra.png" alt="" class="logo">
        Narra
      </button>
      <div class="head-right">
        <button class="note-btn" id="noteBtn" type="button" aria-label="Note for today"></button>
        <span class="pill" id="pill" data-tauri-drag-region>Off</span>
      </div>
    </header>

    <!-- Normal state -->
    <section class="main" id="mainPane" data-tauri-drag-region>
      <div class="clock" data-tauri-drag-region>
        <div class="timer" id="timer" data-tauri-drag-region>0:00:00</div>
        <div class="sub" id="sub" data-tauri-drag-region>&nbsp;</div>
      </div>
      <div class="actions">
        <button class="punch" id="punchBtn" disabled>Time In</button>
        <button class="forgot-link" id="forgotBtn" title="Forgot to punch? Set the time">Set time…</button>
      </div>
    </section>

    <!-- Forgot-to-punch picker -->
    <form class="main forgot" id="forgotPane" hidden>
      <label for="forgotTime" id="forgotLabel">I actually timed in at</label>
      <div class="row">
        <input type="time" id="forgotTime" required>
        <button type="submit" class="punch small" id="forgotSave">Time In</button>
        <button type="button" class="ghost" id="forgotCancel" aria-label="Cancel">✕</button>
      </div>
    </form>

    <!-- Today's note -->
    <form class="main forgot" id="notePane" hidden>
      <label for="noteInput">Note for today · only you see this</label>
      <div class="row">
        <input type="text" id="noteInput" maxlength="500" placeholder="e.g. Clocked in early for a call" autocomplete="off">
        <button type="submit" class="punch small" id="noteSave">Save</button>
        <button type="button" class="ghost" id="noteCancel" aria-label="Cancel">✕</button>
      </div>
    </form>

    <!-- Not connected yet -->
    <section class="main setup" id="setupPane" hidden>
      <p>Finish setting up Narra to start tracking.</p>
      <button class="punch small" id="setupBtn">Open Narra</button>
    </section>

    <footer data-tauri-drag-region>
      <div class="stat" data-tauri-drag-region><span class="label">Today</span><span class="value" id="statToday">0.00</span></div>
      <div class="stat" data-tauri-drag-region><span class="label">Period</span><span class="value" id="statPeriod">—</span></div>
      <div class="stat holiday" data-tauri-drag-region><span class="label">Next holiday</span><span class="value" id="statHoliday">—</span></div>
    </footer>

    <div class="flash" id="flash" hidden></div>
  </div>
  <script src="shared.js"></script>
  <script src="widget.js"></script>
</body>
</html>
